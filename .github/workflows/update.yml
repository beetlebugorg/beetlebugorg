name: Update the profile README

# The README comes from the project data of beetlebug.org: the workflow
# runs tools/profile-readme.ts of the site repo and commits the README if it
# changed.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: beetlebugorg/beetlebugorg.github.io
          path: site

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: node --disable-warning=ExperimentalWarning site/tools/profile-readme.ts > README.md

      - run: |
          if git diff --quiet -- README.md; then
            echo "The README is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update the README from the project data of beetlebug.org"
          git push
