name: Update the profile README

# The README comes from the project data of beetlebug.org: the site build
# writes it to https://beetlebug.org/github-profile.md, and this workflow
# downloads it each hour and commits it if it changed.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The site build writes the README from its project data.
      - run: curl -fsSL https://beetlebug.org/github-profile.md -o README.md

      - run: |
          if git diff --quiet -- README.md; then
            echo "The README is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update the README from the project data of beetlebug.org"
          git push
